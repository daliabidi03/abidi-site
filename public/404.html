<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page introuvable · Mouhamed Ali Abidi</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Schibsted+Grotesk:wght@400;700&family=JetBrains+Mono:wght@600&display=swap" />
    <style>
      :root{--paper:#EDF0F3;--panel:#F7F9FB;--ink:#0F1A2A;--muted:#5A6676;--rule:#C9D1DB;--signal:#E4572E;
        --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
        --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
      @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
        --paper:#0C121C;--panel:#121A26;--ink:#E3E8EF;--muted:#8E9AAB;--rule:#253142;--signal:#FF6B43;color-scheme:dark}}
      :root[data-theme="dark"]{--paper:#0C121C;--panel:#121A26;--ink:#E3E8EF;--muted:#8E9AAB;--rule:#253142;--signal:#FF6B43;color-scheme:dark}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);
        padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
      main{width:min(640px,100%);border-top:2px solid var(--ink);padding-top:16px}
      .k{margin:0;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
      h1{margin:10px 0 14px;font:800 clamp(44px,11vw,84px)/.92 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
      p{margin:0 0 10px;max-width:52ch}
      .en{color:var(--muted)}
      a{display:inline-flex;align-items:center;min-height:44px;margin-top:18px;padding:0 18px;background:var(--signal);color:#fff;
        font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
      a:hover{background:var(--ink);color:var(--paper)}
      a:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <p class="k">§ 404 · Ordre rejeté</p>
      <h1>Page introuvable</h1>
      <p>Cette adresse ne correspond à aucune page du site&nbsp;: elle n'est pas cotée.</p>
      <p class="en" lang="en">This page does not exist: it is not listed.</p>
      <a href="/">Retour au site</a>
    </main>
  </body>
</html>
